name: CI

on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

# ubuntu-latest ships Python 3.12 as its system interpreter, so uv's default
# "managed" preference would silently use /usr/lib/python3.12 for the 3.12 leg
# while downloading managed builds for 3.10/3.11/3.13. That inconsistency made
# the 3.12 job segfault importing jax under coverage. only-managed pins every
# job to a uv-downloaded interpreter, matching local development.
env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # hatch-vcs reads git tags to derive the version

    - name: Set up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.30"
        python-version: "3.12"
        enable-cache: true

    # --locked fails if uv.lock is out of date with pyproject.toml, so a forgotten
    # `uv lock` is caught here rather than silently resolving something different.
    - name: Install dependencies
      run: uv sync --locked --no-default-groups --group dev

    - name: Format check with ruff
      run: uv run ruff check --output-format=github

    - name: Type check with ty
      run: uv run ty check src/

  # publish.yml only runs on release, so without this a packaging regression would
  # first surface during an actual PyPI upload. Cheap enough to run on every PR.
  build-package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # hatch-vcs reads git tags to derive the version

    - name: Set up uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.30"
        python-version: "3.12"
        enable-cache: true

    - name: Build sdist and wheel
      run: uv build --no-create-gitignore

    - name: Validate metadata
      run: uvx twine check dist/*

    - name: Assert wheel and sdist contents
      run: |
        unzip -Z1 dist/*.whl > /tmp/wheel.txt
        tar tzf dist/*.tar.gz > /tmp/sdist.txt

        # The wheel must ship the import package...
        grep -q '^orc/__init__\.py$' /tmp/wheel.txt \
          || { echo "::error::wheel is missing orc/__init__.py"; cat /tmp/wheel.txt; exit 1; }

        # ...and must not leak the repository layout into site-packages.
        if grep -qE '^(src|tests|examples)/' /tmp/wheel.txt; then
          echo "::error::wheel contains repository paths (src/, tests/ or examples/)"
          cat /tmp/wheel.txt
          exit 1
        fi

        # The sdist must ship the example notebooks...
        grep -q 'examples/lorenz\.ipynb' /tmp/sdist.txt \
          || { echo "::error::sdist is missing examples/lorenz.ipynb"; cat /tmp/sdist.txt; exit 1; }

        # ...but never via the docs/examples symlink, which hatchling would
        # otherwise follow and de-duplicate non-deterministically.
        if grep -q 'docs/examples' /tmp/sdist.txt; then
          echo "::error::sdist contains the docs/examples symlink"
          cat /tmp/sdist.txt
          exit 1
        fi

        echo "wheel and sdist contents OK"

  run-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12","3.13"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # hatch-vcs reads git tags to derive the version

    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.30"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-suffix: py${{ matrix.python-version }}

    # Deliberately NOT --locked: --upgrade discards the pins in uv.lock and resolves
    # fresh against PyPI, so a breaking release of jax/equinox/diffrax surfaces here
    # instead of in a user's install. The rewritten lockfile is never committed.
    - name: Install dependencies
      run: uv sync --no-default-groups --group dev --upgrade

    - name: Test with pytest
      run: >
        uv run pytest
        --junitxml=junit/test-results-${{ matrix.os }}-py${{ matrix.python-version }}.xml
        --cov=orc

    - name: Show coverage report
      run: |
        uv run coverage report
        uv run coverage xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Test Summary
      uses: test-summary/action@v2
      with:
        paths: "junit/*.xml"
      if: always()
