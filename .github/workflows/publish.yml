name: Publish to PyPI

on:
  release:
    types: [published]

# Only the publish job needs an OIDC token; keep it out of the build job.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs the tag to derive the version

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.30"
          python-version: "3.12"

      # No `uv sync` here: uv build resolves the build backend under PEP 517
      # isolation, and uv.lock cannot pin build-system requirements.
      - name: Build package
        run: uv build --no-create-gitignore

      # hatch-vcs derives the version from git rather than the release tag, so a
      # shallow checkout or a missing tag would silently produce a wrong version.
      - name: Verify built version matches the release tag
        run: |
          ls -l dist/
          TAG="${GITHUB_REF_NAME#v}"
          if ! ls dist/ | grep -q "openreservoircomputing-${TAG}[-.]"; then
            echo "::error::built artifacts do not match release tag ${TAG}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
