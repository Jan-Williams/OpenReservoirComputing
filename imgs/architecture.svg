<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1065 463" width="1065" height="463"
     font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#4DAEC3"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#4DAEC3"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1065" height="463" fill="white" rx="10" stroke="#D5E8C0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="532" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A1A1A">
    OpenReservoirComputing &#xB7; Software Architecture
  </text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- INPUT BOX                                      -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="15" y="155" width="80" height="44" rx="6" fill="#F5F5F0" stroke="#999" stroke-width="1.5"/>
  <text x="55" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Input</text>
  <text x="55" y="190" text-anchor="middle" font-size="10" fill="#666" font-style="italic">
    u<tspan baseline-shift="sub" font-size="8">t</tspan>
  </text>

  <!-- Arrow Input → Embedding -->
  <line x1="95" y1="177" x2="116" y2="177" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- EMBEDDING BOX                                  -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="117" y="107" width="157" height="140" rx="8" fill="#E5EFD2" stroke="#6B9440" stroke-width="2.2"/>
  <text x="195" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#3A5A1C">orc.embeddings</text>
  <line x1="128" y1="137" x2="263" y2="137" stroke="#6B9440" stroke-width="1" opacity="0.6"/>
  <text x="195" y="152" text-anchor="middle" font-size="9.5" fill="#6B9440" font-style="italic">EmbedBase</text>
  <line x1="128" y1="161" x2="263" y2="161" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="195" y="176" text-anchor="middle" font-size="10" fill="#4A6E28">LinearEmbedding</text>
  <text x="195" y="191" text-anchor="middle" font-size="10" fill="#4A6E28">ParallelLinearEmbedding</text>
  <text x="195" y="206" text-anchor="middle" font-size="10" fill="#4A6E28">EnsembleLinearEmbedding</text>
  <text x="195" y="219" text-anchor="middle" font-size="10" fill="#7A9E4E">&#x2026;</text>
  <line x1="128" y1="225" x2="263" y2="225" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="195" y="238" text-anchor="middle" font-size="9.5" fill="#5A7830" font-style="italic">
    ũ<tspan baseline-shift="sub" font-size="7.5">t</tspan>
    = f<tspan baseline-shift="sub" font-size="7.5">E</tspan>(u<tspan baseline-shift="sub" font-size="7.5">t</tspan>)
  </text>

  <!-- Arrow Embedding → Driver -->
  <line x1="274" y1="177" x2="292" y2="177" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- DRIVER BOX                                     -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="293" y="107" width="157" height="140" rx="8" fill="#E5EFD2" stroke="#6B9440" stroke-width="2.2"/>
  <text x="371" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#3A5A1C">orc.drivers</text>
  <line x1="304" y1="137" x2="439" y2="137" stroke="#6B9440" stroke-width="1" opacity="0.6"/>
  <text x="371" y="152" text-anchor="middle" font-size="9.5" fill="#6B9440" font-style="italic">DriverBase</text>
  <line x1="304" y1="161" x2="439" y2="161" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="371" y="176" text-anchor="middle" font-size="10" fill="#4A6E28">ESNDriver</text>
  <text x="371" y="191" text-anchor="middle" font-size="10" fill="#4A6E28">TaylorDriver</text>
  <text x="371" y="206" text-anchor="middle" font-size="10" fill="#4A6E28">GRUDriver</text>
  <text x="371" y="219" text-anchor="middle" font-size="10" fill="#7A9E4E">&#x2026;</text>
  <line x1="304" y1="225" x2="439" y2="225" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="371" y="238" text-anchor="middle" font-size="9.5" fill="#5A7830" font-style="italic">
    r<tspan baseline-shift="sub" font-size="7.5">t+1</tspan>
    = f<tspan baseline-shift="sub" font-size="7.5">R</tspan>(r<tspan baseline-shift="sub" font-size="7.5">t</tspan>,
    ũ<tspan baseline-shift="sub" font-size="7.5">t</tspan>)
  </text>

  <!-- Arrow Driver → Readout -->
  <line x1="450" y1="177" x2="468" y2="177" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- READOUT BOX                                    -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="469" y="107" width="157" height="140" rx="8" fill="#E5EFD2" stroke="#6B9440" stroke-width="2.2"/>
  <text x="547" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#3A5A1C">orc.readouts</text>
  <line x1="480" y1="137" x2="615" y2="137" stroke="#6B9440" stroke-width="1" opacity="0.6"/>
  <text x="547" y="152" text-anchor="middle" font-size="9.5" fill="#6B9440" font-style="italic">ReadoutBase</text>
  <line x1="480" y1="161" x2="615" y2="161" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="547" y="176" text-anchor="middle" font-size="10" fill="#4A6E28">LinearReadout</text>
  <text x="547" y="191" text-anchor="middle" font-size="10" fill="#4A6E28">QuadraticReadout</text>
  <text x="547" y="206" text-anchor="middle" font-size="10" fill="#4A6E28">EnsembleLinearReadout</text>
  <text x="547" y="219" text-anchor="middle" font-size="10" fill="#7A9E4E">&#x2026;</text>
  <line x1="480" y1="225" x2="615" y2="225" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="547" y="238" text-anchor="middle" font-size="9.5" fill="#5A7830" font-style="italic">
    ŷ<tspan baseline-shift="sub" font-size="7.5">t</tspan>
    = f<tspan baseline-shift="sub" font-size="7.5">O</tspan>(r<tspan baseline-shift="sub" font-size="7.5">t</tspan>)
  </text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- DATA SUBMODULE BOX                             -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="117" y="268" width="174" height="68" rx="7" fill="#ECF2E0" stroke="#7A9055" stroke-width="1.8"/>
  <text x="204" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D5A20">orc.data</text>
  <line x1="128" y1="295" x2="280" y2="295" stroke="#7A9055" stroke-width="0.8" opacity="0.7"/>
  <text x="204" y="310" text-anchor="middle" font-size="9.5" fill="#4A6E28">ODE / PDE integrators</text>
  <text x="204" y="326" text-anchor="middle" font-size="9" fill="#5A7830" font-style="italic">lorenz63 · rossler · KS_1D · lorenz96 · …</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- UTILS SUBMODULE BOX                            -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="311" y="268" width="174" height="68" rx="7" fill="#ECF2E0" stroke="#7A9055" stroke-width="1.8"/>
  <text x="398" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D5A20">orc.utils</text>
  <line x1="322" y1="295" x2="474" y2="295" stroke="#7A9055" stroke-width="0.8" opacity="0.7"/>
  <text x="398" y="310" text-anchor="middle" font-size="9.5" fill="#4A6E28">numerics · regressions · visualization</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- FORK (Readout → base classes)                  -->
  <!-- ══════════════════════════════════════════════ -->
  <!-- Horizontal segment from Readout right edge -->
  <line x1="626" y1="177" x2="643" y2="177" stroke="#444" stroke-width="1.8"/>
  <!-- Vertical fork line -->
  <line x1="643" y1="82" x2="643" y2="272" stroke="#4DAEC3" stroke-width="1.8"/>
  <!-- Branch to Forecaster base -->
  <line x1="643" y1="82" x2="668" y2="82" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <!-- Branch to Classifier base -->
  <line x1="643" y1="177" x2="668" y2="177" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <!-- Branch to Controller base -->
  <line x1="643" y1="272" x2="668" y2="272" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- RC BASE CLASS BOXES (abstract)                 -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- RCForecasterBase (center y=82) -->
  <rect x="668" y="42" width="178" height="80" rx="8" fill="#D5EBF8" stroke="#4DAEC3" stroke-width="2"/>
  <text x="757" y="62" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1A5570">orc.forecaster.RCForecasterBase</text>
  <line x1="679" y1="69" x2="835" y2="69" stroke="#4DAEC3" stroke-width="0.8" opacity="0.6"/>
  <text x="757" y="83" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.force()</text>
  <text x="757" y="96" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.forecast()</text>
  <text x="757" y="109" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.forecast_from_IC()</text>

  <!-- RCClassifierBase (center y=177) -->
  <rect x="668" y="137" width="178" height="80" rx="8" fill="#D5EBF8" stroke="#4DAEC3" stroke-width="2"/>
  <text x="757" y="157" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1A5570">orc.classifier.RCClassifierBase</text>
  <line x1="679" y1="164" x2="835" y2="164" stroke="#4DAEC3" stroke-width="0.8" opacity="0.6"/>
  <text x="757" y="178" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.force()</text>
  <text x="757" y="191" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.classify()</text>

  <!-- RCControllerBase (center y=272) -->
  <rect x="668" y="232" width="178" height="80" rx="8" fill="#D5EBF8" stroke="#4DAEC3" stroke-width="2"/>
  <text x="757" y="252" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1A5570">orc.control.RCControllerBase</text>
  <line x1="679" y1="259" x2="835" y2="259" stroke="#4DAEC3" stroke-width="0.8" opacity="0.6"/>
  <text x="757" y="272" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.force()</text>
  <text x="757" y="285" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.apply_control() · .compute_control()</text>
  <text x="757" y="298" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.compute_penalty()</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ARROWS: base classes → ESN implementations     -->
  <!-- ══════════════════════════════════════════════ -->
  <line x1="846" y1="82"  x2="865" y2="82"  stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="846" y1="177" x2="865" y2="177" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <line x1="846" y1="272" x2="865" y2="272" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-teal)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- BUILT-IN MODEL BOXES (concrete implementations) -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Forecasters (center y=82) -->
  <rect x="865" y="42" width="178" height="80" rx="8" fill="#BEE0F2" stroke="#3A9EC0" stroke-width="2"/>
  <text x="954" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5570">orc.forecaster</text>
  <line x1="876" y1="71" x2="1032" y2="71" stroke="#3A9EC0" stroke-width="0.8" opacity="0.6"/>
  <text x="954" y="85" text-anchor="middle" font-size="9.5" fill="#2A6A85">ESNForecaster</text>
  <text x="954" y="99" text-anchor="middle" font-size="9.5" fill="#2A6A85">EnsembleESNForecaster</text>
  <text x="954" y="113" text-anchor="middle" font-size="9.5" fill="#2A6A85">CESNForecaster</text>

  <!-- Classifiers (center y=177) -->
  <rect x="865" y="137" width="178" height="80" rx="8" fill="#BEE0F2" stroke="#3A9EC0" stroke-width="2"/>
  <text x="954" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5570">orc.classifier</text>
  <line x1="876" y1="166" x2="1032" y2="166" stroke="#3A9EC0" stroke-width="0.8" opacity="0.6"/>
  <text x="954" y="181" text-anchor="middle" font-size="9.5" fill="#2A6A85">ESNClassifier</text>

  <!-- Controllers (center y=272) -->
  <rect x="865" y="232" width="178" height="80" rx="8" fill="#BEE0F2" stroke="#3A9EC0" stroke-width="2"/>
  <text x="954" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5570">orc.control</text>
  <line x1="876" y1="261" x2="1032" y2="261" stroke="#3A9EC0" stroke-width="0.8" opacity="0.6"/>
  <text x="954" y="276" text-anchor="middle" font-size="9.5" fill="#2A6A85">ESNController</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- FOUNDATION BAR                                 -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="15" y="356" width="1035" height="46" rx="6" fill="#EBF3DC" stroke="#6B9440" stroke-width="1.5"/>
  <text x="532" y="376" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3A5A1C">
    Foundation: JAX + Equinox
  </text>
  <text x="532" y="393" text-anchor="middle" font-size="9.5" fill="#5A7830">
    jit compilation &#xB7; vmap across reservoirs and inputs &#xB7; end-to-end differentiability &#xB7; GPU / TPU acceleration
  </text>

</svg>
