<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 388" width="790" height="388"
     font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#4DAEC3"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="790" height="388" fill="white" rx="10" stroke="#D5E8C0" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- INPUT BOX  center=(39, 120)                   -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="8" y="100" width="62" height="40" rx="6" fill="#F5F5F0" stroke="#999" stroke-width="1.5"/>
  <text x="39" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Input</text>
  <text x="39" y="133" text-anchor="middle" font-size="10" fill="#666" font-style="italic">u<tspan baseline-shift="sub" font-size="8">t</tspan></text>

  <!-- Arrow Input → Embedding -->
  <line x1="70" y1="120" x2="82" y2="120" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- EMBEDDING BOX  x=82, y=50, w=125, h=140       -->
  <!--                center=(144.5, 120)             -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="82" y="50" width="125" height="140" rx="8" fill="#E5EFD2" stroke="#6B9440" stroke-width="2.2"/>
  <text x="144" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#3A5A1C">orc.embeddings</text>
  <line x1="92" y1="78" x2="196" y2="78" stroke="#6B9440" stroke-width="1" opacity="0.6"/>
  <text x="144" y="92" text-anchor="middle" font-size="9.5" fill="#6B9440" font-style="italic">EmbedBase</text>
  <line x1="92" y1="100" x2="196" y2="100" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="144" y="114" text-anchor="middle" font-size="9" fill="#4A6E28">LinearEmbedding</text>
  <text x="144" y="128" text-anchor="middle" font-size="9" fill="#4A6E28">ParallelLinearEmbedding</text>
  <text x="144" y="142" text-anchor="middle" font-size="9" fill="#4A6E28">EnsembleLinearEmbedding</text>
  <text x="144" y="153" text-anchor="middle" font-size="9" fill="#7A9E4E">&#x2026;</text>
  <line x1="92" y1="160" x2="196" y2="160" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="144" y="174" text-anchor="middle" font-size="9" fill="#5A7830" font-style="italic">ũ<tspan baseline-shift="sub" font-size="7">t</tspan> = f<tspan baseline-shift="sub" font-size="7">E</tspan>(u<tspan baseline-shift="sub" font-size="7">t</tspan>)</text>

  <!-- Arrow Embedding → Driver -->
  <line x1="207" y1="120" x2="218" y2="120" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- DRIVER BOX  x=218, y=50, w=125, h=140         -->
  <!--             center=(280.5, 120)                -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="218" y="50" width="125" height="140" rx="8" fill="#E5EFD2" stroke="#6B9440" stroke-width="2.2"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#3A5A1C">orc.drivers</text>
  <line x1="228" y1="78" x2="332" y2="78" stroke="#6B9440" stroke-width="1" opacity="0.6"/>
  <text x="280" y="92" text-anchor="middle" font-size="9.5" fill="#6B9440" font-style="italic">DriverBase</text>
  <line x1="228" y1="100" x2="332" y2="100" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="280" y="114" text-anchor="middle" font-size="9" fill="#4A6E28">ESNDriver</text>
  <text x="280" y="128" text-anchor="middle" font-size="9" fill="#4A6E28">TaylorDriver</text>
  <text x="280" y="142" text-anchor="middle" font-size="9" fill="#4A6E28">GRUDriver</text>
  <text x="280" y="153" text-anchor="middle" font-size="9" fill="#7A9E4E">&#x2026;</text>
  <line x1="228" y1="160" x2="332" y2="160" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="280" y="174" text-anchor="middle" font-size="9" fill="#5A7830" font-style="italic">r<tspan baseline-shift="sub" font-size="7">t+1</tspan> = f<tspan baseline-shift="sub" font-size="7">R</tspan>(r<tspan baseline-shift="sub" font-size="7">t</tspan>, ũ<tspan baseline-shift="sub" font-size="7">t</tspan>)</text>

  <!-- Arrow Driver → Readout -->
  <line x1="343" y1="120" x2="354" y2="120" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- READOUT BOX  x=354, y=50, w=125, h=140        -->
  <!--              center=(416.5, 120)               -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="354" y="50" width="125" height="140" rx="8" fill="#E5EFD2" stroke="#6B9440" stroke-width="2.2"/>
  <text x="416" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#3A5A1C">orc.readouts</text>
  <line x1="364" y1="78" x2="468" y2="78" stroke="#6B9440" stroke-width="1" opacity="0.6"/>
  <text x="416" y="92" text-anchor="middle" font-size="9.5" fill="#6B9440" font-style="italic">ReadoutBase</text>
  <line x1="364" y1="100" x2="468" y2="100" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="416" y="114" text-anchor="middle" font-size="9" fill="#4A6E28">LinearReadout</text>
  <text x="416" y="128" text-anchor="middle" font-size="9" fill="#4A6E28">QuadraticReadout</text>
  <text x="416" y="142" text-anchor="middle" font-size="9" fill="#4A6E28">EnsembleLinearReadout</text>
  <text x="416" y="153" text-anchor="middle" font-size="9" fill="#7A9E4E">&#x2026;</text>
  <line x1="364" y1="160" x2="468" y2="160" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="416" y="174" text-anchor="middle" font-size="9" fill="#5A7830" font-style="italic">ŷ<tspan baseline-shift="sub" font-size="7">t</tspan> = f<tspan baseline-shift="sub" font-size="7">O</tspan>(r<tspan baseline-shift="sub" font-size="7">t</tspan>)</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- FORK  (Readout → base classes)                 -->
  <!-- ══════════════════════════════════════════════ -->
  <!-- Horizontal segment from Readout right edge -->
  <line x1="479" y1="120" x2="490" y2="120" stroke="#444" stroke-width="1.8"/>
  <!-- Vertical fork: Forecaster center (y=40) to Controller center (y=208) -->
  <line x1="490" y1="40" x2="490" y2="208" stroke="#4DAEC3" stroke-width="1.8"/>
  <!-- Branch to Forecaster base -->
  <line x1="490" y1="40"  x2="500" y2="40"  stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <!-- Branch to Classifier base -->
  <line x1="490" y1="120" x2="500" y2="120" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <!-- Branch to Controller base -->
  <line x1="490" y1="208" x2="500" y2="208" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- RC BASE CLASS BOXES  x=500, w=145             -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- RCForecasterBase: y=5, h=70, center_y=40 -->
  <rect x="500" y="5" width="145" height="70" rx="8" fill="#D5EBF8" stroke="#4DAEC3" stroke-width="2"/>
  <text x="572" y="22" text-anchor="middle" font-size="7.5" fill="#2A7090" font-style="italic">orc.forecaster</text>
  <text x="572" y="36" text-anchor="middle" font-size="9" font-weight="bold" fill="#1A5570">RCForecasterBase</text>
  <line x1="510" y1="42" x2="634" y2="42" stroke="#4DAEC3" stroke-width="0.8" opacity="0.6"/>
  <text x="572" y="54" text-anchor="middle" font-size="8.5" fill="#2A7090" font-style="italic">.force()  ·  .forecast()</text>
  <text x="572" y="67" text-anchor="middle" font-size="8.5" fill="#2A7090" font-style="italic">.forecast_from_IC()</text>

  <!-- RCClassifierBase: y=85, h=70, center_y=120 -->
  <rect x="500" y="85" width="145" height="70" rx="8" fill="#D5EBF8" stroke="#4DAEC3" stroke-width="2"/>
  <text x="572" y="102" text-anchor="middle" font-size="7.5" fill="#2A7090" font-style="italic">orc.classifier</text>
  <text x="572" y="116" text-anchor="middle" font-size="9" font-weight="bold" fill="#1A5570">RCClassifierBase</text>
  <line x1="510" y1="122" x2="634" y2="122" stroke="#4DAEC3" stroke-width="0.8" opacity="0.6"/>
  <text x="572" y="134" text-anchor="middle" font-size="8.5" fill="#2A7090" font-style="italic">.force()</text>
  <text x="572" y="147" text-anchor="middle" font-size="8.5" fill="#2A7090" font-style="italic">.classify()</text>

  <!-- RCControllerBase: y=165, h=85, center_y=207.5 -->
  <rect x="500" y="165" width="145" height="85" rx="8" fill="#D5EBF8" stroke="#4DAEC3" stroke-width="2"/>
  <text x="572" y="182" text-anchor="middle" font-size="7.5" fill="#2A7090" font-style="italic">orc.control</text>
  <text x="572" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#1A5570">RCControllerBase</text>
  <line x1="510" y1="202" x2="634" y2="202" stroke="#4DAEC3" stroke-width="0.8" opacity="0.6"/>
  <text x="572" y="214" text-anchor="middle" font-size="8.5" fill="#2A7090" font-style="italic">.force()  ·  .apply_control()</text>
  <text x="572" y="227" text-anchor="middle" font-size="8.5" fill="#2A7090" font-style="italic">.compute_control()</text>
  <text x="572" y="240" text-anchor="middle" font-size="8.5" fill="#2A7090" font-style="italic">.compute_penalty()</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ARROWS: base classes → implementations        -->
  <!-- ══════════════════════════════════════════════ -->
  <line x1="645" y1="40"  x2="655" y2="40"  stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="645" y1="120" x2="655" y2="120" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="645" y1="208" x2="655" y2="208" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- IMPLEMENTATIONS  x=655, w=125                 -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- Forecasters: y=5, h=70, center_y=40 -->
  <rect x="655" y="5" width="125" height="70" rx="8" fill="#BEE0F2" stroke="#3A9EC0" stroke-width="2"/>
  <text x="717" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5570">orc.forecaster</text>
  <line x1="665" y1="32" x2="769" y2="32" stroke="#3A9EC0" stroke-width="0.8" opacity="0.6"/>
  <text x="717" y="46" text-anchor="middle" font-size="9" fill="#2A6A85">ESNForecaster</text>
  <text x="717" y="58" text-anchor="middle" font-size="9" fill="#2A6A85">EnsembleESNForecaster</text>
  <text x="717" y="70" text-anchor="middle" font-size="9" fill="#2A6A85">CESNForecaster</text>

  <!-- Classifiers: y=85, h=70, center_y=120 -->
  <rect x="655" y="85" width="125" height="70" rx="8" fill="#BEE0F2" stroke="#3A9EC0" stroke-width="2"/>
  <text x="717" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5570">orc.classifier</text>
  <line x1="665" y1="112" x2="769" y2="112" stroke="#3A9EC0" stroke-width="0.8" opacity="0.6"/>
  <text x="717" y="129" text-anchor="middle" font-size="9" fill="#2A6A85">ESNClassifier</text>

  <!-- Controllers: y=165, h=85, center_y=207.5 -->
  <rect x="655" y="165" width="125" height="85" rx="8" fill="#BEE0F2" stroke="#3A9EC0" stroke-width="2"/>
  <text x="717" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5570">orc.control</text>
  <line x1="665" y1="192" x2="769" y2="192" stroke="#3A9EC0" stroke-width="0.8" opacity="0.6"/>
  <text x="717" y="209" text-anchor="middle" font-size="9" fill="#2A6A85">ESNController</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- DATA SUBMODULE BOX  x=82, w=200, h=65         -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="82" y="262" width="200" height="65" rx="7" fill="#ECF2E0" stroke="#7A9055" stroke-width="1.8"/>
  <text x="182" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#3D5A20">orc.data</text>
  <line x1="92" y1="287" x2="272" y2="287" stroke="#7A9055" stroke-width="0.8" opacity="0.7"/>
  <text x="182" y="301" text-anchor="middle" font-size="9.5" fill="#4A6E28">ODE / PDE integrators</text>
  <text x="182" y="316" text-anchor="middle" font-size="8.5" fill="#5A7830" font-style="italic">lorenz63 · rossler · KS_1D · lorenz96 · …</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- UTILS SUBMODULE BOX  x=290, w=200, h=65       -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="290" y="262" width="200" height="65" rx="7" fill="#ECF2E0" stroke="#7A9055" stroke-width="1.8"/>
  <text x="390" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#3D5A20">orc.utils</text>
  <line x1="300" y1="287" x2="480" y2="287" stroke="#7A9055" stroke-width="0.8" opacity="0.7"/>
  <text x="390" y="301" text-anchor="middle" font-size="9.5" fill="#4A6E28">numerics · regressions · visualization</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- FOUNDATION BAR                                 -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="8" y="337" width="774" height="42" rx="6" fill="#EBF3DC" stroke="#6B9440" stroke-width="1.5"/>
  <text x="395" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3A5A1C">
    Foundation: JAX + Equinox
  </text>
  <text x="395" y="371" text-anchor="middle" font-size="9.5" fill="#5A7830">
    jit compilation &#xB7; vmap across reservoirs and inputs &#xB7; end-to-end differentiability &#xB7; GPU / TPU acceleration
  </text>

</svg>
