<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 500" width="790" height="500"
     font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#4DAEC3"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="790" height="500" fill="white" rx="10" stroke="#D5E8C0" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 1: FOUNDATION BAR (full width)            -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="8" y="8" width="774" height="46" rx="6" fill="#EBF3DC" stroke="#6B9440" stroke-width="1.5"/>
  <text x="395" y="29" text-anchor="middle" font-size="13" font-weight="bold" fill="#3A5A1C">Foundation: JAX + Equinox</text>
  <text x="395" y="44" text-anchor="middle" font-size="10.5" fill="#5A7830">jit compilation &#xB7; vmap across reservoirs and inputs &#xB7; end-to-end differentiability &#xB7; GPU / TPU acceleration</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 2: DATA BOX  x=8, y=64, w=378, h=76      -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="8" y="64" width="378" height="76" rx="7" fill="#ECF2E0" stroke="#7A9055" stroke-width="1.8"/>
  <text x="197" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#3D5A20">orc.data</text>
  <line x1="18" y1="91" x2="376" y2="91" stroke="#7A9055" stroke-width="0.8" opacity="0.7"/>
  <text x="197" y="105" text-anchor="middle" font-size="11" fill="#4A6E28">ODE / PDE integrators</text>
  <text x="197" y="120" text-anchor="middle" font-size="10" fill="#5A7830" font-style="italic">lorenz63 · rossler · KS_1D · lorenz96 · …</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 2: UTILS BOX  x=396, y=64, w=386, h=76   -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="396" y="64" width="386" height="76" rx="7" fill="#ECF2E0" stroke="#7A9055" stroke-width="1.8"/>
  <text x="589" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#3D5A20">orc.utils</text>
  <line x1="406" y1="91" x2="772" y2="91" stroke="#7A9055" stroke-width="0.8" opacity="0.7"/>
  <text x="589" y="105" text-anchor="middle" font-size="11" fill="#4A6E28">numerics · regressions · visualization</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 3: PIPELINE GROUPING RECT                 -->
  <!-- Surrounds Embedding, Driver, Readout          -->
  <!-- x=155, y=148, w=480, h=150                   -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="155" y="148" width="480" height="150" rx="10" fill="#F5F9EE" stroke="#6B9440" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 3: INPUT BOX  center=(117, 223)           -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="86" y="203" width="62" height="40" rx="6" fill="#F5F5F0" stroke="#999" stroke-width="1.5"/>
  <text x="117" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Input</text>
  <text x="117" y="236" text-anchor="middle" font-size="11" fill="#666" font-style="italic">u<tspan baseline-shift="sub" font-size="9">t</tspan></text>

  <!-- Arrow Input → Embedding -->
  <line x1="148" y1="223" x2="163" y2="223" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 3: EMBEDDING BOX  x=163, y=152, w=148, h=142 -->
  <!--                       center_x=237, center_y=223 -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="163" y="152" width="148" height="142" rx="8" fill="#E5EFD2" stroke="#6B9440" stroke-width="2.2"/>
  <text x="237" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#3A5A1C">orc.embeddings</text>
  <line x1="173" y1="179" x2="301" y2="179" stroke="#6B9440" stroke-width="1" opacity="0.6"/>
  <text x="237" y="192" text-anchor="middle" font-size="11" fill="#6B9440" font-style="italic">EmbedBase</text>
  <line x1="173" y1="200" x2="301" y2="200" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="237" y="213" text-anchor="middle" font-size="10" fill="#4A6E28">LinearEmbedding</text>
  <text x="237" y="226" text-anchor="middle" font-size="10" fill="#4A6E28">ParallelLinearEmbedding</text>
  <text x="237" y="239" text-anchor="middle" font-size="10" fill="#4A6E28">EnsembleLinearEmbedding</text>
  <text x="237" y="250" text-anchor="middle" font-size="9" fill="#7A9E4E">&#x2026;</text>
  <line x1="173" y1="257" x2="301" y2="257" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="237" y="271" text-anchor="middle" font-size="10" fill="#5A7830" font-style="italic">ũ<tspan baseline-shift="sub" font-size="8">t</tspan> = f<tspan baseline-shift="sub" font-size="8">E</tspan>(u<tspan baseline-shift="sub" font-size="8">t</tspan>)</text>

  <!-- Arrow Embedding → Driver -->
  <line x1="311" y1="223" x2="321" y2="223" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 3: DRIVER BOX  x=321, y=152, w=148, h=142 -->
  <!--                    center_x=395, center_y=223  -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="321" y="152" width="148" height="142" rx="8" fill="#E5EFD2" stroke="#6B9440" stroke-width="2.2"/>
  <text x="395" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#3A5A1C">orc.drivers</text>
  <line x1="331" y1="179" x2="459" y2="179" stroke="#6B9440" stroke-width="1" opacity="0.6"/>
  <text x="395" y="192" text-anchor="middle" font-size="11" fill="#6B9440" font-style="italic">DriverBase</text>
  <line x1="331" y1="200" x2="459" y2="200" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="395" y="213" text-anchor="middle" font-size="10" fill="#4A6E28">ESNDriver</text>
  <text x="395" y="226" text-anchor="middle" font-size="10" fill="#4A6E28">TaylorDriver</text>
  <text x="395" y="239" text-anchor="middle" font-size="10" fill="#4A6E28">GRUDriver</text>
  <text x="395" y="250" text-anchor="middle" font-size="9" fill="#7A9E4E">&#x2026;</text>
  <line x1="331" y1="257" x2="459" y2="257" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="395" y="271" text-anchor="middle" font-size="10" fill="#5A7830" font-style="italic">r<tspan baseline-shift="sub" font-size="8">t+1</tspan> = f<tspan baseline-shift="sub" font-size="8">R</tspan>(r<tspan baseline-shift="sub" font-size="8">t</tspan>, ũ<tspan baseline-shift="sub" font-size="8">t</tspan>)</text>

  <!-- Arrow Driver → Readout -->
  <line x1="469" y1="223" x2="479" y2="223" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 3: READOUT BOX  x=479, y=152, w=148, h=142 -->
  <!--                     center_x=553, center_y=223  -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="479" y="152" width="148" height="142" rx="8" fill="#E5EFD2" stroke="#6B9440" stroke-width="2.2"/>
  <text x="553" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#3A5A1C">orc.readouts</text>
  <line x1="489" y1="179" x2="617" y2="179" stroke="#6B9440" stroke-width="1" opacity="0.6"/>
  <text x="553" y="192" text-anchor="middle" font-size="11" fill="#6B9440" font-style="italic">ReadoutBase</text>
  <line x1="489" y1="200" x2="617" y2="200" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="553" y="213" text-anchor="middle" font-size="10" fill="#4A6E28">LinearReadout</text>
  <text x="553" y="226" text-anchor="middle" font-size="10" fill="#4A6E28">QuadraticReadout</text>
  <text x="553" y="239" text-anchor="middle" font-size="10" fill="#4A6E28">EnsembleLinearReadout</text>
  <text x="553" y="250" text-anchor="middle" font-size="9" fill="#7A9E4E">&#x2026;</text>
  <line x1="489" y1="257" x2="617" y2="257" stroke="#6B9440" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="553" y="271" text-anchor="middle" font-size="10" fill="#5A7830" font-style="italic">ŷ<tspan baseline-shift="sub" font-size="8">t</tspan> = f<tspan baseline-shift="sub" font-size="8">O</tspan>(r<tspan baseline-shift="sub" font-size="8">t</tspan>)</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- FORK: Readout → Base Classes                  -->
  <!-- Horizontal stub right from Readout edge,      -->
  <!-- vertical trunk down, horizontal bar across,   -->
  <!-- three branches down to base class boxes.      -->
  <!-- ══════════════════════════════════════════════ -->
  <!-- Stub right from Readout right edge -->
  <line x1="627" y1="223" x2="648" y2="223" stroke="#4DAEC3" stroke-width="1.8"/>
  <!-- Vertical trunk down to fork level -->
  <line x1="648" y1="223" x2="648" y2="318" stroke="#4DAEC3" stroke-width="1.8"/>
  <!-- Horizontal bar spanning all three column centres -->
  <line x1="225" y1="318" x2="648" y2="318" stroke="#4DAEC3" stroke-width="1.8"/>
  <!-- Three branch arrows down into base class boxes -->
  <line x1="225" y1="318" x2="225" y2="328" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="395" y1="318" x2="395" y2="328" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="565" y1="318" x2="565" y2="328" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 4: BASE CLASS BOXES  y=328, h=85          -->
  <!-- Col1 x=148 (center 225)                       -->
  <!-- Col2 x=318 (center 395)                       -->
  <!-- Col3 x=488 (center 565)                       -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- RCForecasterBase -->
  <rect x="148" y="328" width="155" height="85" rx="8" fill="#D5EBF8" stroke="#4DAEC3" stroke-width="2"/>
  <text x="225" y="345" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">orc.forecaster</text>
  <text x="225" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5570">RCForecasterBase</text>
  <line x1="158" y1="365" x2="293" y2="365" stroke="#4DAEC3" stroke-width="0.8" opacity="0.6"/>
  <text x="225" y="378" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.force()  ·  .forecast()</text>
  <text x="225" y="391" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.forecast_from_IC()</text>

  <!-- RCClassifierBase -->
  <rect x="318" y="328" width="155" height="85" rx="8" fill="#D5EBF8" stroke="#4DAEC3" stroke-width="2"/>
  <text x="395" y="345" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">orc.classifier</text>
  <text x="395" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5570">RCClassifierBase</text>
  <line x1="328" y1="365" x2="463" y2="365" stroke="#4DAEC3" stroke-width="0.8" opacity="0.6"/>
  <text x="395" y="378" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.force()</text>
  <text x="395" y="391" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.classify()</text>

  <!-- RCControllerBase -->
  <rect x="488" y="328" width="155" height="85" rx="8" fill="#D5EBF8" stroke="#4DAEC3" stroke-width="2"/>
  <text x="565" y="345" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">orc.control</text>
  <text x="565" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A5570">RCControllerBase</text>
  <line x1="498" y1="365" x2="633" y2="365" stroke="#4DAEC3" stroke-width="0.8" opacity="0.6"/>
  <text x="565" y="376" text-anchor="middle" font-size="8.5" fill="#2A7090" font-style="italic">.force()  ·  .apply_control()</text>
  <text x="565" y="388" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.compute_control()</text>
  <text x="565" y="401" text-anchor="middle" font-size="9" fill="#2A7090" font-style="italic">.compute_penalty()</text>

  <!-- Arrows: base classes → implementations -->
  <line x1="225" y1="413" x2="225" y2="423" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="395" y1="413" x2="395" y2="423" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="565" y1="413" x2="565" y2="423" stroke="#4DAEC3" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 5: IMPLEMENTATION BOXES  y=425, h=68      -->
  <!-- Col1 x=148 (center 225)                       -->
  <!-- Col2 x=318 (center 395)                       -->
  <!-- Col3 x=488 (center 565)                       -->
  <!-- ══════════════════════════════════════════════ -->

  <!-- orc.forecaster implementations -->
  <rect x="148" y="425" width="155" height="68" rx="8" fill="#BEE0F2" stroke="#3A9EC0" stroke-width="2"/>
  <text x="225" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5570">orc.forecaster</text>
  <line x1="158" y1="450" x2="293" y2="450" stroke="#3A9EC0" stroke-width="0.8" opacity="0.6"/>
  <text x="225" y="462" text-anchor="middle" font-size="10" fill="#2A6A85">ESNForecaster</text>
  <text x="225" y="474" text-anchor="middle" font-size="10" fill="#2A6A85">EnsembleESNForecaster</text>
  <text x="225" y="486" text-anchor="middle" font-size="10" fill="#2A6A85">CESNForecaster</text>

  <!-- orc.classifier implementations -->
  <rect x="318" y="425" width="155" height="68" rx="8" fill="#BEE0F2" stroke="#3A9EC0" stroke-width="2"/>
  <text x="395" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5570">orc.classifier</text>
  <line x1="328" y1="450" x2="463" y2="450" stroke="#3A9EC0" stroke-width="0.8" opacity="0.6"/>
  <text x="395" y="462" text-anchor="middle" font-size="10" fill="#2A6A85">ESNClassifier</text>

  <!-- orc.control implementations -->
  <rect x="488" y="425" width="155" height="68" rx="8" fill="#BEE0F2" stroke="#3A9EC0" stroke-width="2"/>
  <text x="565" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A5570">orc.control</text>
  <line x1="498" y1="450" x2="633" y2="450" stroke="#3A9EC0" stroke-width="0.8" opacity="0.6"/>
  <text x="565" y="462" text-anchor="middle" font-size="10" fill="#2A6A85">ESNController</text>

</svg>
